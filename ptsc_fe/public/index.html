    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!-- Favicon mặc định — sẽ bị ghi đè bởi script bên dưới nếu có cấu hình theme -->
    <link rel="icon" href="/logoTCLogin.png" />

    <script src="/appConfig.js"></script>

    <script>
      // Script này sẽ chạy ngay lập tức để cập nhật tiêu đề trang từ localStorage
      (function() {
        try {
          const savedThemeOptions = localStorage.getItem('themeOptions');
          if (savedThemeOptions) {
            const themeOptions = JSON.parse(savedThemeOptions);
            if (themeOptions && themeOptions.app && themeOptions.app.logoText) {
              document.title = themeOptions.app.logoText;
            }
            if (themeOptions && themeOptions.app && themeOptions.app.logoTab) {
              let favicon = document.querySelector('link[rel*="icon"]');
              if (!favicon) {
                favicon = document.createElement('link');
                favicon.rel = 'icon';
                document.head.appendChild(favicon);
              }
              favicon.href = themeOptions.app.logoTab;

              let appleTouchIcon = document.querySelector('link[rel="apple-touch-icon"]');
              if (!appleTouchIcon) {
                appleTouchIcon = document.createElement('link');
                appleTouchIcon.rel = 'apple-touch-icon';
                document.head.appendChild(appleTouchIcon);
              }
              appleTouchIcon.href = themeOptions.app.logoTab;
            }
            if (themeOptions && themeOptions.app && themeOptions.app.description) {
              // Sử dụng querySelector để tìm và cập nhật thẻ meta
              const metaDesc = document.querySelector('meta[name="description"]');
              if (metaDesc) metaDesc.setAttribute('content', themeOptions.app.description);
            }
          }
        } catch (e) {
          logger.error('Lỗi khi đặt tiêu đề từ localStorage:', e);
        }
      })();
    </script>
